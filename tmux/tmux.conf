# ─────────────────────────────────────────────────────────────────────────
#  tmux — standalone (no Nix needed). Plugins via TPM:
#    git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#  then inside tmux: prefix + I   (install.sh does the clone for you)
# ─────────────────────────────────────────────────────────────────────────

# ── Core options ─────────────────────────────────────────────────────────
set  -g default-terminal "tmux-256color"
if-shell "command -v fish" 'set -g default-command "fish"'
set  -g base-index      1
setw -g pane-base-index 1
set  -g status-keys vi
set  -g mode-keys   vi
set  -g mouse        on
set  -g focus-events on
set  -s escape-time  10
set  -g history-limit 50000

# ── Plugins ──────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-default-processes 'vi vim view emacs man less more tail top htop btop yazi lazygit'
set -g @resurrect-processes '"~(^|/)nvim( |$)->nvim +TmuxSessionRestore" "~fcc-claude->fcc-claude --continue" "~(^|/)claude( |$)->claude --continue"'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# ── Status bar (set before TPM runs: continuum hooks into status-right) ──
set -g status-style "bg=#7e8d50,fg=#000000"
set -g status-left "[#S] "
set -g status-left-length 20
set -g status-right "%H:%M "
set -g status-right-length 10

# ── Colors (truecolor so fish/nvim hex colors render exactly) ────────────
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-overrides ",xterm-kitty:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── General ──────────────────────────────────────────────────────────────
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on        # images / OSC sequences from Claude, nvim
set -g detach-on-destroy off       # closing a session jumps to another one
set -g set-titles on
set -g set-titles-string "#S / #W"
setw -g automatic-rename on
set -g display-time 2000

# ── Prefix: Ctrl-b (tmux default) ──────────────────────────────────────

# ── Windows (= tabs) ─────────────────────────────────────────────────────
bind c   new-window -c "#{pane_current_path}"
bind n   next-window
bind p   previous-window
bind Tab last-window
bind ,   command-prompt -I "#W" "rename-window '%%'"
bind <   swap-window -t -1 \; previous-window
bind >   swap-window -t +1 \; next-window
# prefix 1..9 jump to window (tmux default), or alt+1..9 without prefix
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# ── Panes (= splits) ─────────────────────────────────────────────────────
bind |  split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind x  kill-pane
bind z  resize-pane -Z             # zoom toggle
bind h  select-pane -L
bind j  select-pane -D
bind k  select-pane -U
bind l  select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind =  select-layout -E           # even out panes

# Ctrl-h/j/k/l without prefix: move between tmux panes AND nvim splits
# (nvim side lives in nvim/lua/neotex/config/keymaps.lua)
# Panes running nvim/fzf/Claude Code get the key themselves (Claude: Ctrl-j = newline);
# from those use the prefix version (Ctrl-b h/j/k/l) to leave the pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|l?n?vim?x?|fzf)(diff)?|claude|[0-9]+[.][0-9]+[.][0-9]+)$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind C-l send-keys C-l             # prefix Ctrl-l = clear screen

# ── Sessions (= projects) ────────────────────────────────────────────────
bind s  choose-tree -Zs            # pick session
bind w  choose-tree -Zw            # pick window across sessions
bind S  command-prompt -p "new session:" "new-session -A -s '%%' -c '#{pane_current_path}'"
bind (  switch-client -p
bind )  switch-client -n
bind d  detach-client

# ── Copy mode (vi) ───────────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# clipboard tool: pbcopy (macOS), wl-copy (Wayland) or xclip (X11)
if-shell "command -v pbcopy" \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"' \
  'if-shell "command -v wl-copy" "bind -T copy-mode-vi y send -X copy-pipe-and-cancel wl-copy; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel wl-copy" "bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"xclip -selection clipboard\"; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel \"xclip -selection clipboard\""'

# ── Forgiving prefix: same action if you're still holding Ctrl ───────────
# (Ctrl-b Ctrl-c == Ctrl-b c, etc.) so a sloppy release never gets ignored.
unbind C-z                         # was suspend-client: looked like a freeze
bind C-c new-window -c "#{pane_current_path}"
bind C-n next-window
bind C-p previous-window
bind C-x kill-pane
bind C-d detach-client
bind C-w choose-tree -Zw
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-o rotate-window
bind C-\\ split-window -h -c "#{pane_current_path}"
bind C-_ split-window -v -c "#{pane_current_path}"   # Ctrl-b Ctrl--

# ── Misc ─────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind C-s run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh
bind C-r run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh

# ── Window names ─────────────────────────────────────────────────────────
# (status bar: see top of file)
# Claude Code's process name is its version number (e.g. 2.1.316) -> show "claude"
setw -g automatic-rename-format "#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}"

# ── TPM (keep at the very bottom) ────────────────────────────────────────
if-shell "test -d ~/.config/tmux/plugins/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
