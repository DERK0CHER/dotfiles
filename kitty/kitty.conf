#FONTS

font_size 25.0
font_family  hasklig 
bold_font        auto
italic_font      auto
bold_italic_font auto FONT
# Draws a thin stroke around every glyph = heavier, higher-contrast text
# (closest thing to a "text border"). 0 = off, 0.5-1.0 = noticeable.
macos_thicken_font 0.6
# Gamma/contrast for text rendering: higher first number = bolder/crisper text
text_composition_strategy 1.7 30
# font_family      Fairfax Hax HD
# font_family      JetBrains Mono
# bold_font        JetBrains Mono Bold
# italic_font      JetBrains Mono Italic
# bold_italic_font JetBrains Mono Bold Italic

# font-family: "Iosevka Curly", monospace;
#  font_family      Iosevka Fixed semi-bold
#  bold_font        Iosevka Fixed Bold
#  italic_font      Iosevka Fixed Italic
#  bold_italic_font Iosevka Fixed Bold Italic
#
# bold_italic_font auto


# Pick faces by family + style (kitty's key=value form)
# font_family      family="Iosevka" style="Medium"
# italic_font      family="Iosevka" style="Medium Oblique"
# bold_font        family="Iosevka" style="Semibold"
# bold_italic_font family="Iosevka" style="Semibold Oblique"


# NERD FONT ICONS: keep the text font, take every Nerd Font icon from the
# icons-only font installed by nix (nerd-fonts.symbols-only in packages.nix).
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono


# PERFORMANCE
repaint_delay 10
input_delay 3
sync_to_monitor yes

# LAYOUT
remember_window_size  yes
initial_window_width  960
initial_window_height 1052
# Space between text and border
window_padding_width 12

# APPEARANCE
hide_window_decorations yes
background_opacity 1.0
# Colors live in themes/*.conf; current-theme.conf is a symlink managed by
# the fish `theme` command (theme default | theme calm).
include current-theme.conf

# GENERAL
# Left Option = Alt (tmux alt+1..9, nvim alt maps); right Option still types
# special characters on the German layout (@ | [ ] { } ~).
macos_option_as_alt left
shell /run/current-system/sw/bin/fish
editor nvim
copy_on_select yes

# MAPPINGS
# map key combine : action1 : action2 : action3 ...
map ctrl+space>c new_tab
map ctrl+space>w new_os_window
map ctrl+space>k close_tab
map ctrl+space>n next_tab
map ctrl+space>p previous_tab

map ctrl+shift+equal change_font_size current +2.0
map ctrl+shift+plus change_font_size current +2.0
map ctrl+shift+minus change_font_size current -2.0
map ctrl+shift+kp_subtract change_font_size current -2.0

# TAB BAR
tab_bar_min_tabs 2
tab_bar_margin_width 4
tab_bar_style powerline
tab_powerline_style angled
  #OR round, slanted
# tab_title_max_length 12
tab_title_template "{index}"
  #AND {fmt.fg.red}{bell_symbol}{activity_symbol}
tab_bar_background none
active_tab_foreground   #000
active_tab_background   #eee
active_tab_font_style   bold-italic
inactive_tab_foreground #444
inactive_tab_background #999
inactive_tab_font_style normal
